<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap5 Navbar Dropdown</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=settings" />
</head>
<body>
  <div class="container-fluid bg-success">
    TEST
  </div>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="#">사이트명</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <!-- 메뉴1 -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="menu1Dropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              메뉴1
            </a>
            <ul class="dropdown-menu" aria-labelledby="menu1Dropdown">
              <li><a class="dropdown-item" href="#">메뉴 1-1</a></li>
              <li><a class="dropdown-item" href="#">메뉴 1-2</a></li>
              <li><a class="dropdown-item" href="#">메뉴 1-3</a></li>
            </ul>
          </li>

          <!-- 메뉴2 -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="menu2Dropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              메뉴2
            </a>
            <ul class="dropdown-menu" aria-labelledby="menu2Dropdown">
              <li><a class="dropdown-item" href="#">메뉴 2-1</a></li>
              <li><a class="dropdown-item" href="#">메뉴 2-2</a></li>
            </ul>
          </li>

          <!-- 메뉴3 -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="menu3Dropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              메뉴3
            </a>
            <ul class="dropdown-menu" aria-labelledby="menu3Dropdown">
              <li><a class="dropdown-item" href="#">논어</a></li>
              <li><a class="dropdown-item" href="#">맹자</a></li>
            </ul>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
        <div class="col-4"><img src="img/01.jpg" class="img-fluid"></div>
        <div class="col-6">6</div>
        <div class="col-2"><img src="img/01.jpg" class="img-fluid"></div>
    </div>

    <div class="row">
        <div class="col-2">ID</div>
        <div class="col">
            <input type="text" class="form-control">
        </div>
    </div>

    <div class="row">
        <div class="col-2">ID</div>
        <div class="col">
            <input type="text" class="form-control" placeholder="아이디를 입력하세요">
        </div>
    </div>

    <div class="row">
        <div class="col-2">PW</div>
        <div class="col">
            <input type="password" class="form-control" placeholder="비밀번호를 입력하세요">
        </div>
    </div>

    <div class="row">
        <div class="col-2">E-mail</div>
        <div class="col">
            <input type="email" class="form-control" placeholder="이메일을 입력하세요">
        </div>
    </div>

    <div class="row">
        <div class="col-2">나이</div>
        <div class="col">
            <input type="number" class="form-control" placeholder="나이를 입력하세요">
        </div>
    </div>

    <div class="row">
        <div class="col-2">지역</div>
        <div class="col">
            <select class="form-control" >
                <option value="">== 선택하세요 ==</option>
                <option value="서울">서울</option>
                <option value="대전" selected>대전</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col-2">성별</div>
        <div class="col">
            <input type="radio" name="gender" value="1"> 남성 
            <input type="radio" name="gender" value="2" checked> 여성 
        </div>
    </div>

    <div class="row">
        <div class="col-2">내용</div>
        <div class="col">
            <textarea class="form-control" rows="10">
                글을 작성합니다.
            </textarea>    
        </div>
    </div>

    <div class="row">
        <div class="col-2">버튼</div>
        <div class="col"> 
            <button type="button">버튼</button>
        </div>
        <div class="col"> 
            <button type="button" class="btn btn-primary">버튼</button>
        </div>
        <div class="col"> 
            <button type="button" class="btn btn-success form-control">버튼</button>
        </div>
        <div class="col"> 
            <button type="button" class="btn btn-success form-control"><span class="material-symbols-outlined">
settings
</span>검색</button>
        </div>
    </div>


  </div>

</body>
</html>
